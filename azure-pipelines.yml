trigger:
  branches:
    include:
      - master
  tags:
    include:
      - v*

pr: none

pool:
  name: Default

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    fetchTags: true
    persistCredentials: true

  - task: UseDotNet@2
    displayName: Use .NET SDK from global.json
    inputs:
      packageType: sdk
      useGlobalJson: true
      performMultiLevelLookup: true

  - pwsh: dotnet --info
    displayName: Show .NET SDK info

  - pwsh: dotnet tool restore
    displayName: Restore local .NET tools

  - pwsh: dotnet run --project build/MouseKeyProxy.Build.csproj -- --target ShowVersion --configuration Release
    displayName: Nuke ShowVersion

  - pwsh: dotnet run --project build/MouseKeyProxy.Build.csproj -- --target ValidateTraceability --configuration Release
    displayName: Nuke ValidateTraceability

  - pwsh: dotnet run --project build/MouseKeyProxy.Build.csproj -- --target Test --configuration Release
    displayName: Nuke Test

  - pwsh: dotnet run --project build/MouseKeyProxy.Build.csproj -- --target TestPowerShell --configuration Release
    displayName: Nuke TestPowerShell

  - pwsh: dotnet run --project build/MouseKeyProxy.Build.csproj -- --target PackRepl --configuration Release
    displayName: Nuke PackRepl

  - task: PublishBuildArtifacts@1
    displayName: Publish tool package artifact
    inputs:
      PathtoPublish: output/packages
      ArtifactName: MouseKeyProxy.Repl
      publishLocation: Container

  - pwsh: dotnet run --project build/MouseKeyProxy.Build.csproj -- --target PublishToolToNuGet --configuration Release
    displayName: Nuke PublishToolToNuGet
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    env:
      NUGET_API_KEY: $(NUGET_API_KEY)

  - pwsh: |
      if (-not $env:OCTOPUS_API_KEY) {
        Write-Host 'OCTOPUS_API_KEY not set; skipping Octopus LEGION2 release'
        exit 0
      }
      $url = if ($env:OCTOPUS_URL) { $env:OCTOPUS_URL.TrimEnd('/') } else { 'http://PAYTON-LEGION2:8066' }
      $env:OCTOPUS_URL = $url
      $env:OCTOPUS_SPACE = if ($env:OCTOPUS_SPACE) { $env:OCTOPUS_SPACE } else { 'Default' }
      $project = 'MouseKeyProxy'
      $version = ('$(Build.BuildNumber)' -replace '[^0-9A-Za-z\.\-_+]', '-')
      if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.$(Build.BuildId)' }
      $octo = 'C:\Program Files\Octopus CLI\octopus.exe'
      if (-not (Test-Path $octo)) { throw "octopus CLI missing: $octo" }
      Write-Host "Octopus $url project=$project version=$version"
      & $octo release create --project $project --version $version --packageVersion $version --releaseNotes "ADO $(Build.DefinitionName) $(Build.SourceVersion)" --ignoreExisting --no-prompt
      if ($LASTEXITCODE -ne 0) { throw "octopus release create failed exit $LASTEXITCODE" }
      & $octo release deploy --project $project --version $version --deployTo Development --progress --no-prompt
      if ($LASTEXITCODE -ne 0) { Write-Warning "octopus deploy Development exit $LASTEXITCODE (release still created)" }
    displayName: Octopus LEGION2 release
    condition: and(succeeded(), ne(variables['SkipOctopus'], 'true'))
    env:
      OCTOPUS_API_KEY: $(OCTOPUS_API_KEY)
      OCTOPUS_URL: $(OCTOPUS_URL)
      OCTOPUS_SPACE: $(OCTOPUS_SPACE)

